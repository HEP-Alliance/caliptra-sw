[package]
name = "caliptra-common"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitfield.workspace = true
bitflags.workspace = true
caliptra-cfi-lib.workspace = true
caliptra-cfi-derive.workspace = true
caliptra-cpu.workspace = true
caliptra-drivers.workspace = true
caliptra-error.workspace = true
caliptra-image-types = { workspace = true, default-features = false }
caliptra-image-verify.workspace = true
caliptra-api.workspace = true
caliptra-registers.workspace = true
memoffset.workspace = true
ufmt.workspace = true
zerocopy.workspace = true
zeroize.workspace = true
riscv.workspace = true
caliptra-x509 = { workspace = true, default-features = false }

[features]
default = ["std", "cfi"]
emu = ["caliptra-drivers/emu"]
std = []
rom = ["caliptra-drivers/rom"]
fmc = []
runtime = []
cfi = ["caliptra-drivers/cfi"]
# Stub out MLDSA87 key generation/sign/verify to avoid touching Adams Bridge
# hardware entirely (for SoCs with no Adams Bridge accelerator present at
# all, as opposed to a merely-defective one). Key gen returns an all-zero
# public key, sign returns an all-zero signature, verify always succeeds.
# This makes MLDSA identity/signature data cryptographically meaningless --
# only safe to use where MLDSA functionality is being deliberately dropped.
no-adams-bridge-kat = []
